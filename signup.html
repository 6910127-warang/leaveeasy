<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก · LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/util.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/signup.js" defer></script>
</head>
<body>
  <div id="nav"></div>

  <div class="container" style="max-width:420px">
    <h1>สมัครสมาชิก</h1>
    <p class="subtitle">สมัครสำเร็จแล้วเข้าสู่ระบบให้ทันที บทบาทเริ่มต้นคือ ผู้ขอลา</p>

    <div class="card">
      <div id="ข้อความเตือน" class="alert alert-error hidden"></div>

      <form id="ฟอร์มสมัคร">
        <label for="name">ชื่อ-นามสกุล</label>
        <input type="text" id="name" autocomplete="name">

        <label for="email">อีเมล</label>
        <input type="email" id="email" autocomplete="username">

        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" autocomplete="new-password">
        <p class="hint">อย่างน้อย 6 ตัวอักษร</p>

        <div class="btn-row">
          <button type="submit" id="ปุ่มสมัคร">สมัครสมาชิก</button>
        </div>
      </form>

      <p class="hint">มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a></p>
    </div>
  </div>
</body>
</html>
